apiVersion: v2
name: odoo-doodba
description: >-
  Odoo on Kubernetes from a Doodba image (Tecnativa), with an optional
  CloudNativePG database, k8up volume backups with a nightly restore test, and
  a restricted-by-default security posture. Made to be driven by Flux.
type: application
# 4.0.0 is a rewrite: no Bitnami subcharts, secrets only by reference, no
# values compatible with 3.x. See README.md "Upgrading from 3.x".
version: 4.0.0
appVersion: "18.0"
icon: https://odoocdn.com/openerp_website/static/src/img/assets/png/odoo_logo.png?a=b
keywords:
  - odoo
  - doodba
  - cloudnative-pg
  - k8up
home: https://github.com/pledra/odoo-cloud-addons
sources:
  - https://github.com/pledra/odoo-cloud-addons/tree/main/helm-charts/odoo-doodba
  - https://github.com/Tecnativa/doodba
maintainers:
  - name: PCatinean
    url: https://github.com/pledra/odoo-cloud-addons
