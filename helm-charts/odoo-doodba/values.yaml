# odoo-doodba 4.x. One release = one Odoo instance = one database.
# Secrets are never values here: everything secret is a reference to a
# Secret you create (External Secrets, sealed secrets, ...).

nameOverride: ""
fullnameOverride: ""

image:
  # Your Doodba project image (required).
  repository: ""
  # Prefer an immutable tag (e.g. 18.0-<commit>) or a digest.
  tag: ""
  # sha256:... ; when set it wins over the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

odoo:
  # The one database this instance serves (PGDATABASE; dbfilter ^<name>$).
  database: odoo
  # Required: Secret holding Odoo's master password (admin_passwd). With
  # listDb false the database manager is off, but the password still exists.
  adminPasswordSecret:
    name: ""
    key: admin-password
  # 0 = threaded mode (one process: HTTP, cron, websocket). Plenty for a few
  # users. > 0 = prefork: that many HTTP workers plus a gevent process on
  # 8072 for /websocket, routed by the Ingress.
  workers: 0
  maxCronThreads: 1
  proxyMode: true
  listDb: false
  # "all" up to Odoo 18; Odoo 19+ wants a boolean ("True") and warns otherwise.
  withoutDemo: all
  # Accent-insensitive search; the unaccent extension is created in the
  # built-in CNPG database automatically.
  unaccent: true
  # Extra [options] for odoo.conf (key: value). Example:
  #   limit_time_real: 600
  config: {}
  # Extra sections, e.g. { queue_job: { channels: "root:2" } }
  extraSections: {}
  # ir.config_parameter values enforced on every start (before Odoo serves).
  # report.url: wkhtmltopdf fetches report CSS from this URL; the public URL
  # may sit behind an auth gate, so point it at the pod itself.
  systemParameters:
    report.url: http://localhost:8069
  # Before Odoo starts (init container):
  #  - empty database (no tables) and initialize=true: install base
  #  - otherwise, if moduleUpdate.enabled: click-odoo-update (only addons
  #    whose files changed since the last update)
  initialize: true
  # Off: a new image only replaces the code; the database is updated when you
  # run /opt/helm/update.sh in the pod (README "Deploying a new image").
  # extraArgs apply to both. --ignore-core-addons: Odoo's own addons are not
  # updated (safe under Odoo's stable policy); drop it for a full update.
  moduleUpdate:
    enabled: false
    extraArgs: ["--ignore-core-addons"]
  extraEnv: []
  extraEnvFrom: []

# Built-in PostgreSQL (CloudNativePG). Odoo uses the operator-generated
# Secret <name>-app; no password handling here.
cnpg:
  enabled: true
  name: postgres
  instances: 1
  # Empty = the operator's default PostgreSQL image.
  imageName: ""
  # A single instance with a PDB blocks every node drain.
  enablePDB: false
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
  owner: odoo
  parameters: {}
  postInitApplicationSQL: []
  # Raw spec.bootstrap override (e.g. recovery from a backup). Default:
  # initdb with database=odoo.database, owner=cnpg.owner.
  bootstrap: {}
  # Raw spec.externalClusters (used together with a recovery bootstrap).
  externalClusters: []
  # Base backups + WAL archiving with the Barman Cloud plugin.
  backup:
    enabled: false
    # s3://bucket/prefix/
    destinationPath: ""
    endpointURL: ""
    retentionPolicy: 30d
    # Six-field cron (seconds first).
    schedule: "0 30 2 * * *"
    s3Credentials:
      secretName: ""
      accessKeyIdKey: ACCESS_KEY_ID
      secretAccessKeyKey: ACCESS_SECRET_KEY
      regionKey: REGION
    sidecarResources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }

# When cnpg.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  user: odoo
  passwordSecret:
    name: ""
    key: password

# /var/lib/odoo: filestore and sessions.
persistence:
  enabled: true
  existingClaim: ""
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  annotations: {}

# Volume backups with k8up (restic). The PVC is annotated
# k8up.io/backup "true"/"false" from this switch either way, so the decision
# is always explicit.
backup:
  enabled: false
  schedule: "15 3 * * *"
  prune:
    schedule: "45 4 * * 0"
    retention: { keepDaily: 7, keepWeekly: 4, keepMonthly: 6 }
  checkSchedule: "15 5 * * 0"
  s3:
    endpoint: ""
    # bucket or bucket/prefix
    bucket: ""
    credentialsSecret:
      name: ""
      accessKeyKey: access-key
      secretKeyKey: secret-key
  passwordSecret:
    name: ""
    key: restic-password
  # Pushgateway URL for k8up's restic metrics (and the canary result).
  promURL: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }
  # A k8up job that cannot even start its pod (e.g. refused by admission)
  # stays "Running" forever; with a deadline it fails and alerts.
  activeDeadlineSeconds: 10800
  # Nightly restore test: write a timestamp into the volume before the
  # backup, restore only that file from the latest snapshot afterwards, push
  # backup_canary_restore_success / backup_canary_age_seconds
  # (job=backup_canary, instance=<namespace>) to the Pushgateway.
  canary:
    enabled: true
    image: restic/restic:0.19.1
    writeSchedule: "5 3 * * *"
    verifySchedule: "15 4 * * *"

service:
  type: ClusterIP
  port: 8069
  geventPort: 8072

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: true
    secretName: ""
  # Prefork mode only (odoo.workers > 0): path served by the gevent process.
  # /websocket for Odoo 16+, /longpolling for 15 and older.
  geventPath: /websocket

resources:
  requests: { cpu: 50m, memory: 512Mi }
  limits: { memory: 1536Mi }
# The init container (module update) defaults to the same resources.
initResources: {}

probes:
  # /web/health exists from Odoo 16. For 15 and older use type: tcp.
  type: http
  path: /web/health
  startup: { periodSeconds: 10, failureThreshold: 30, timeoutSeconds: 5 }
  liveness: { periodSeconds: 30, failureThreshold: 4, timeoutSeconds: 5 }
  readiness: { periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 5 }

# Doodba images run as odoo (1000:1000). Satisfies the "restricted" Pod
# Security Standard. On SELinux hosts (MicroOS) set a fixed
# seLinuxOptions.level per instance: the backup pods reuse it to read the
# volume.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
  # Doodba writes /opt/odoo/auto at start.
  readOnlyRootFilesystem: false

networkPolicy:
  enabled: false
  # Namespaces allowed to reach Odoo's HTTP ports (the ingress controller).
  ingressNamespaces: [traefik]
  cnpgOperatorNamespace: cnpg-system
  # Namespace allowed to scrape PostgreSQL (port 9187); empty to skip.
  monitoringNamespace: monitoring
  # cert-manager HTTP-01 solver pods in this namespace, reached by the ingress controller.
  acmeSolver: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraVolumes: []
extraVolumeMounts: []

# Extra manifests, rendered with tpl (ExternalSecrets, Middlewares, ...).
extraObjects: []
