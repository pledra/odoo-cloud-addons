{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "odoo.claimName" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
  annotations:
    # Explicit backup decision either way (k8up only backs up "true").
    k8up.io/backup: {{ .Values.backup.enabled | quote }}
    # Keep the filestore if the release is uninstalled.
    helm.sh/resource-policy: keep
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes: [{{ .Values.persistence.accessMode | quote }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
