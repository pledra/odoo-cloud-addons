{{- if .Values.ingress.enabled -}}
{{- $host := required "ingress.host is required" .Values.ingress.host -}}
{{- $svc := include "odoo.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ default (printf "%s-tls" $svc) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if gt (int .Values.odoo.workers) 0 }}
          - path: {{ .Values.ingress.geventPath }}
            pathType: Prefix
            backend:
              service: { name: {{ $svc }}, port: { name: gevent } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $svc }}, port: { name: http } }
{{- end }}
