apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "odoo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if gt (int .Values.odoo.workers) 0 }}
    - name: gevent
      port: {{ .Values.service.geventPort }}
      targetPort: gevent
    {{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "odoo.serviceAccountName" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
