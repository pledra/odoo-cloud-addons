{{- $options := dict "workers" .Values.odoo.workers "max_cron_threads" .Values.odoo.maxCronThreads -}}
{{- if gt (int .Values.odoo.workers) 0 }}
{{- $_ := set $options "gevent_port" .Values.service.geventPort -}}
{{- end }}
{{- $options = mergeOverwrite $options .Values.odoo.config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
data:
  # Doodba merges /opt/odoo/custom/conf.d/* after its own templates and
  # expands $VARIABLES from the environment.
  90-helm.conf: |
    [options]
    {{- range $k, $v := $options }}
    {{ $k }} = {{ $v }}
    {{- end }}
    {{- range $section, $kv := .Values.odoo.extraSections }}

    [{{ $section }}]
    {{- range $k, $v := $kv }}
    {{ $k }} = {{ $v }}
    {{- end }}
    {{- end }}
  # Init container: runs through Doodba's entrypoint (waits for the
  # database, links addons, writes odoo.conf), then this.
  prepare.sh: |
    #!/bin/sh
    set -eu
    state=$(python3 - <<'EOF'
    import os
    import psycopg2
    try:
        conn = psycopg2.connect(dbname=os.environ["PGDATABASE"])
    except psycopg2.OperationalError as e:
        print("unreachable" if "does not exist" not in str(e) else "missing")
        raise SystemExit
    cur = conn.cursor()
    cur.execute("SELECT to_regclass('ir_module_module')")
    print("ready" if cur.fetchone()[0] else "empty")
    EOF
    )
    echo "database $PGDATABASE: $state"
    case "$state" in
      missing|unreachable)
        echo "cannot continue: database $PGDATABASE is $state" >&2
        exit 1 ;;
      empty)
        {{- if .Values.odoo.initialize }}
        echo "installing base into the empty database"
        odoo -d "$PGDATABASE" -i base --stop-after-init --no-http
        {{- else }}
        echo "database is empty and odoo.initialize is false: restore a dump first" >&2
        exit 1
        {{- end }}
        ;;
      ready)
        {{- if .Values.odoo.moduleUpdate.enabled }}
        /bin/sh /opt/helm/update.sh
        {{- else }}
        echo "module update disabled"
        {{- end }}
        ;;
    esac
    {{- if .Values.odoo.systemParameters }}
    click-odoo -d "$PGDATABASE" /opt/helm/system_parameters.py
    {{- end }}
  update.sh: |
    #!/bin/sh
    # Updates the addons whose files changed since the last update. Extra
    # arguments are passed on (e.g. --update-all, --i18n-overwrite).
    set -eu
    echo "updating changed addons in $PGDATABASE"
    exec click-odoo-update -d "$PGDATABASE"{{ range .Values.odoo.moduleUpdate.extraArgs }} {{ . | quote }}{{ end }} "$@"
  system_parameters.py: |
    # Run by click-odoo (provides `env`; commits on success).
    import json
    wanted = json.loads({{ .Values.odoo.systemParameters | toJson | quote }})
    params = env["ir.config_parameter"].sudo()
    # Odoo 20 replaced get_param/set_param with typed get_str/set_str.
    get = getattr(params, "get_str", None) or params.get_param
    put = getattr(params, "set_str", None) or params.set_param
    for key, value in wanted.items():
        if get(key) != str(value):
            put(key, str(value))
            print("system parameter %s set" % key)
