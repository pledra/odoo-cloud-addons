{{- $prefork := gt (int .Values.odoo.workers) 0 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
spec:
  # One replica: the filestore volume is ReadWriteOnce and Odoo's cron/
  # session handling assume a single server here.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: odoo
  template:
    metadata:
      labels:
        {{- include "odoo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: odoo
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "odoo.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: prepare
          image: {{ include "odoo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/bin/sh", "/opt/helm/prepare.sh"]
          env:
            {{- include "odoo.env" . | nindent 12 }}
          {{- with .Values.odoo.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml (default .Values.resources .Values.initResources) | nindent 12 }}
          volumeMounts:
            {{- include "odoo.volumeMounts" . | nindent 12 }}
            - name: config
              mountPath: /opt/helm/prepare.sh
              subPath: prepare.sh
              readOnly: true
            - name: config
              mountPath: /opt/helm/system_parameters.py
              subPath: system_parameters.py
              readOnly: true
      containers:
        - name: odoo
          image: {{ include "odoo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "odoo.env" . | nindent 12 }}
          {{- with .Values.odoo.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8069
            {{- if $prefork }}
            - name: gevent
              containerPort: {{ .Values.service.geventPort }}
            {{- end }}
          {{- range $probe := list "startup" "liveness" "readiness" }}
          {{ $probe }}Probe:
            {{- if eq $.Values.probes.type "tcp" }}
            tcpSocket: { port: http }
            {{- else }}
            httpGet: { path: {{ $.Values.probes.path }}, port: http }
            {{- end }}
            {{- toYaml (get $.Values.probes $probe) | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "odoo.volumeMounts" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "odoo.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "odoo.claimName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
